.hero.stadium-photo{border:1px solid #997c4b;box-shadow:inset 0 -45px 100px #050f22aa,0 18px 65px #03081066;overflow:hidden;min-height:315px}
.hero.stadium-photo .pitch{opacity:.45;pointer-events:none}.hero.stadium-photo h2{text-shadow:0 4px 20px #02050ecc}
.latest-results{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:21px 24px;border:1px solid #98733e;border-radius:17px;background:linear-gradient(120deg,#2a2625,#182b32 65%,#152438);box-shadow:0 12px 32px #0002}
.latest-results h3{margin:6px 0;font-size:21px}.latest-results p{margin:0;color:#b3c3ce;font-size:12px}
.report-hero{border-radius:19px;border:1px solid #b58f4a;min-height:225px;padding:37px 30px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 -30px 55px #0006}
.report-hero h2{margin:12px 0 7px;font-size:clamp(30px,4vw,53px);font-family:var(--serif);line-height:1.04;letter-spacing:-.03em}.report-hero p{max-width:550px;color:#d9dde4;font-size:14px;margin:0}
.reportsection>.between{margin-bottom:20px}.resultgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.resultcard{background:linear-gradient(155deg,#192c42,#0b1627);border:1px solid #374d61;border-radius:15px;padding:15px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.resultcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--homecolor),#bdab7b,var(--awaycolor))}
.resultcard:hover{border-color:#d5ac61;transform:translateY(-1px)}.result-head{display:flex;justify-content:space-between;align-items:center;gap:6px}.result-head .tag{font-size:9px}
.result-main{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;margin:18px 0 14px}.result-team{min-width:0;display:flex;align-items:center;flex-direction:column;gap:7px;text-align:center}.result-team strong{font-size:13px;line-height:1.27;min-height:34px}.crest.large{height:56px;width:46px;font-size:15px}
.result-score{text-align:center}.result-score strong{white-space:nowrap;display:block;font-size:36px;letter-spacing:-.07em;color:#f2dfb7;line-height:1.05;font-family:var(--serif)}.result-score strong span{color:#798b9c;margin:0 5px}.result-score small{display:block;color:#79cdb9;font-size:10px;margin-top:6px;font-weight:900;letter-spacing:.07em}
.result-goals{display:grid;gap:3px;min-height:26px;border-top:1px solid #2b3b50;padding:10px 1px;color:#a7becf;font-size:11px;max-height:82px;overflow:auto}.result-bottom{display:flex;align-items:center;justify-content:space-between;gap:9px;padding-top:7px}.result-bottom>span{color:#bbccda;max-width:58%;line-height:1.4}.result-bottom button{white-space:nowrap}
.union-focus{display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(90deg,#401c2a,#161e32);border:1px solid #9f4254;padding:18px 20px;border-radius:15px}.union-focus p{margin:7px 0 0;font-size:12px;color:#d7a7b1}
.stadium-band{min-height:225px;border-radius:18px;border:1px solid #8c754b;display:flex;align-items:end;padding:26px 31px}.stadium-band h2{font-size:clamp(25px,4vw,39px);margin:8px 0;letter-spacing:-.03em}.stadium-band p{color:#cdd9e5;margin:0;max-width:500px}
.trophywall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:15px 0 24px}.trophy-mini{display:flex;align-items:center;flex-direction:column;gap:7px;background:linear-gradient(#243449,#111d2b);border:1px solid #655c43;padding:14px 4px;border-radius:10px;color:#e4c68b;font-size:9px;font-weight:bold}.trophy-mini span{font-size:32px}
.formathelp{font-size:12px;color:#cdd4da;padding:11px 13px;border-left:3px solid #caad64;background:#243145}

/* NOVERIA 3 — mercado de fichajes y carrera de entrenador */
.market-cover{position:relative;min-height:270px;display:flex;align-items:end;padding:30px 34px;border:1px solid #ad894e;border-radius:19px;box-shadow:0 20px 54px #0004;overflow:hidden}
.market-cover h2{font:900 clamp(38px,6vw,66px)/.98 Georgia,serif;letter-spacing:-.045em;margin:10px 0 12px;max-width:650px;text-shadow:0 4px 20px #0009}
.market-cover p{font-size:14px;line-height:1.6;color:#d3dee6;max-width:550px}
.market-hub{background:linear-gradient(126deg,#192939,#262c35 58%,#182735);border-color:#6d654f}
.market-hub>.between{gap:18px;align-items:flex-start;flex-wrap:wrap}
.deadline-track{height:10px;overflow:hidden;border:1px solid #485666;background:#101e2d;border-radius:9px;margin:20px 0}
.deadline-track>div{height:100%;background:linear-gradient(90deg,#dbb36b,#f0d8a7);box-shadow:0 0 17px #dfb66d70;transition:width .35s}
.market-event{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #40506166;font-size:12px}
.market-event>.controls{flex-shrink:0}.market-event .tag{margin-top:5px}
.market-filters{display:grid;grid-template-columns:minmax(180px,2fr) minmax(95px,.8fr) minmax(140px,1fr) auto;gap:12px;align-items:end;margin:20px 0}
.market-filters .btn{height:43px}.market-negotiation{display:flex;justify-content:space-between;align-items:center;border-radius:13px;border:1px solid #625537;background:linear-gradient(125deg,#1f3144,#2b2c31);padding:21px}
.market-negotiation h2{font-size:26px;margin:5px 0}.market-negotiation p{font-size:12px;color:#bccbd8}
.market-ovr{font-size:42px;font-weight:900;color:#e7c37e;border:2px solid #ab8750;border-radius:14px;padding:8px 13px}
@media(max-width:870px){.market-filters{grid-template-columns:1fr 1fr}.market-filters>.field:first-child{grid-column:1/-1}.market-filters .btn{align-self:end}}
@media(max-width:580px){.market-cover{min-height:225px;padding:22px}.market-cover h2{font-size:38px}.market-filters{grid-template-columns:1fr}.market-filters>.field:first-child{grid-column:auto}.market-event{flex-wrap:wrap}.market-event .controls{width:100%}.market-event .btn{flex:1}.market-cover p{font-size:12px}}

function submitMarketOffer(s,{buyer,seller,playerId,fee,wage,years}){

 const from=s.teams[seller],to=s.teams[buyer];if(!from||seller===buyer)throw Error('Elegí un jugador de otro club');
 const p=from.players.find(x=>String(x.id)===String(playerId));if(!p)throw Error('Futbolista no disponible');
 if(from.players.length<=17||to.players.length>=30)throw Error('El fichaje no es viable por los límites de plantilla');
 fee=Number(fee);wage=Number(wage);years=Number(years);
 if(!Number.isFinite(fee)||fee<0.05||!Number.isFinite(wage)||wage<15||!Number.isInteger(years)||years<1||years>5)throw Error('Revisá la oferta y los años de contrato');
 if(to.budget<fee)throw Error('No tenés suficiente dinero para la oferta');
 const valuation=marketValuation(p),required=+(valuation*(1.10+Math.max(0,80-p.ovr)*.002)).toFixed(2);
 const offer={id:'offer-'+s.market.cycle+'-'+(s.market.offers.length+1),buyer,seller,playerId:p.id,player:p.name,fee,wage,years,day:s.market.day,status:'',asking:required};
 const r=seeded('offer-'+s.seed+'-'+offer.id+'-'+buyer+'-'+p.id);
 const ratio=fee/Math.max(.1,valuation);
 if(wage<p.salary*.83){offer.status='rejected';offer.reason='El jugador no acepta el salario propuesto';}
 else if(ratio<.76){offer.status='rejected';offer.reason='La directiva vendedora considera insuficiente la oferta';}
 else if(ratio<1.10 || (r()<.19&&ratio<1.22)){
   offer.status='counter';offer.asking=+(Math.max(required,fee*1.12)).toFixed(2);
   if(offer.asking>to.budget)offer.status='rejected',offer.reason='La contraoferta supera tu presupuesto';
 }else{const rec=marketTransfer(s,seller,buyer,p.id,fee,wage,years,'oferta del usuario');offer.status='accepted';offer.transferId=rec.id;}
 s.market.offers.unshift(offer);
 return offer;
}

function aiDeal(s,day,attempt){
 const r=seeded('NOVERIA-AI-'+s.seed+'-'+s.market.cycle+'-'+day+'-'+attempt);
 const clubs=Object.values(s.teams).filter(t=>t.players.length<30&&t.budget>.6&&!(s.mode==='manager'&&s.managedClub===t.name));
 const buyer=pick(clubs,r);if(!buyer)return null;
 const sources=Object.values(s.teams).filter(t=>t.name!==buyer.name&&t.players.length>18&&!(s.mode==='manager'&&s.managedClub===t.name));if(!sources.length)return null;
 const seller=pick(sources,r);
 // Directores deportivos buscan posiciones escasas y refuerzos realistas.
 const top=buyer.players.slice(0,11);const weakest=top.slice().sort((a,b)=>a.ovr-b.ovr)[0];
 let candidates=seller.players.filter(p=>p.ovr>=buyer.rating-15&&p.ovr<=buyer.rating+17&&p.pos!=='POR'&&p.value/1000<buyer.budget*.65);
 if(weakest&&r()<.55){let byPosition=candidates.filter(p=>p.pos===weakest.pos);if(byPosition.length)candidates=byPosition;}
 if(!candidates.length)return null;
 const p=pick(candidates,r);const fee=+(marketValuation(p)*(.95+r()*.45)).toFixed(2),wage=Math.round(p.salary*(1.02+r()*.28)),years=1+Math.floor(r()*5);
 if(fee>buyer.budget*.73||seller.players.length<=18||r()<.25)return null;
 try{return marketTransfer(s,seller.name,buyer.name,p.id,fee,wage,years,'negociación automática')}catch{return null;}
}
function advanceMarketDay(s){ensureMarket(s);const m=s.market;if(m.status!=='open')throw Error('No hay ninguna ventana abierta');
 const day=m.day,added=[];const attempts=12+(day===m.maxDays?30:0);
 for(let i=0;i<attempts;i++){const t=aiDeal(s,day,i);if(t)added.push(t)}
 if(day>=m.maxDays){m.status='closed';m.lastReport={title:m.title,cycle:m.cycle,transfers:m.log.length,automatic:m.log.filter(t=>t.method==='negociación automática').length,totalSpent:+m.log.reduce((v,t)=>v+t.fee,0).toFixed(2)};
  m.offers.forEach(o=>{if(o.status==='counter')o.status='expired'});
  // Desarrollo orgánico juvenil entre ventanas sin alterar partidos históricos.
  for(const t of Object.values(s.teams))for(const p of t.players){const rand=seeded('growth-'+s.seed+'-'+m.cycle+'-'+p.id);if(p.age<=23&&p.ovr<p.pot&&rand()<.12)p.ovr++;}
  addNews(s,'Mercado',`¡CIERRA EL MERCADO! ${m.log.length} operaciones`,`${m.title} concluye con ${m.log.length} traspasos. La dirección deportiva de cada club prepara la próxima etapa.`);
 }else m.day++;

}
function finishMarket(s){ensureMarket(s);if(s.market.status!=='open')throw Error('Abrí el mercado antes de simularlo');const started=s.market.log.length;const updates=[];
 while(s.market.status==='open')updates.push(advanceMarketDay(s));

}

// NUEVAS TEMPORADAS: calendario renovado, ascensos/descensos e historia intacta.
function startNextSeason(s){
 ensureMarket(s);
 if(s.postseason?.stage!=='finalizada')throw Error('Primero hay que terminar las semifinales, final y Recopa');
 if(s.market.status==='open')throw Error('Primero cerrá el mercado de pases actual');
 const fallenA=standings(s,'A').at(-1).name,fallenB=standings(s,'B').at(-1).name;
 const promoted=standings(s,'S').slice(0,2).map(x=>x.name);
 const archive={season:s.season,fixtures:s.fixtures,postseason:s.postseason,cup:s.cup,annual:standings(s,'annual').map(r=>({...r})),A:standings(s,'A'),B:standings(s,'B'),second:standings(s,'S'),relegated:[fallenA,fallenB],promoted:[...promoted]};
 s.archive.unshift(archive);
 // La estructura oficial original tiene 9 plazas A, 9 B y 10 S.
 // Cada ascendido ocupa exactamente la plaza del descendido; las 9 localías
 // y 9 visitas del calendario original se mantienen cada temporada.
 const keys=Object.keys(s.slotMap);
 function swapNames(a,b){const k1=keys.find(k=>s.slotMap[k]===a),k2=keys.find(k=>s.slotMap[k]===b);
  if(!k1||!k2)throw Error('No se encontraron plazas de clasificación para '+a+' / '+b);
  [s.slotMap[k1],s.slotMap[k2]]=[s.slotMap[k2],s.slotMap[k1]];
 }
 swapNames(fallenA,promoted[0]);swapNames(fallenB,promoted[1]);
 for(const t of TEAMS.filter(t=>t.division!=='EXT')){
  const team=s.teams[s.slotMap[t.name]];team.group=t.group;team.division=t.division;
 }
 for(const t of Object.values(s.teams)){
  for(const p of t.players){p.age++;if(Number.isInteger(p.contractYears)&&p.contractYears>1)p.contractYears--;p.outGames=0;}
  if(t.division==='LSV')t.budget=+(t.budget+2.3).toFixed(3);
  else if(t.division==='LPV')t.budget=+(t.budget+1.2).toFixed(3);
 }
 s.season++;
 s.fixtures=FIXTURES.map(f=>({id:f.id+'-'+s.season,competition:f.competition,group:f.group,round:f.round,slot:f.slot,seq:f.seq,home:s.slotMap[f.home],away:s.slotMap[f.away],scoreH:null,scoreA:null,played:false,legacy:false}));
 s.cup=initialCup();s.cup.fixtures.forEach(f=>f.id=f.id+'-'+s.season);
 s.postseason={stage:'locked',leg:1,fixtures:[],apertura:null,recopa:null};s.leagueRound=0;
 s.market.status='closed';s.market.offers=[];s.market.log=[];
 s.market.title='Mercado de Noveria';
 addNews(s,'Nueva temporada',`¡Comienza el Apertura ${s.season}!`,`${promoted.join(' y ')} ascienden. ${fallenA} y ${fallenB} disputarán la Liga de Plata.`);
 return {season:s.season,promoted,relegated:[fallenA,fallenB]};
}

 const eventText=ev=>ev.type==='goal'?`⚽ GOL de ${ev.p1Name}${ev.p2Name?` · asistencia de ${ev.p2Name}`:''}`:ev.type==='yellow'?`🟨 Amonestado ${ev.p1Name}`:ev.type==='red'?`🟥 Expulsado ${ev.p1Name}`:ev.type==='injury'?`🚑 Lesión de ${ev.p1Name}`:`🔄 Cambio: sale ${ev.p1Name}, entra ${ev.p2Name}`;
 const metric=(name,a,b,percent=false)=>`<div class="paperstat"><b>${a}${percent?'%':''}</b><span>${E(name)}</span><b>${b}${percent?'%':''}</b></div>`;
 const lines=(players,team)=>`<div><div style="font-weight:800;margin-bottom:7px">${E(team.name)}</div>${players.map(p=>`<div class="event" style="grid-template-columns:24px 1fr;gap:7px"><b>${p.number}</b><span>${E(p.name)} · ${p.pos} <b>${p.form.toFixed(1)}</b></span></div>`).join('')}</div>`;
 const summary=src?'Este encuentro pertenece al archivo de las seis primeras jornadas, disputadas en nuestra historia antes de la creación de la aplicación. Se conserva el resultado original sin inventar goleadores, estadísticas ni acontecimientos que no fueron registrados.':m.summary;
 const date=m.competition==='LSV'?'LIGA SUPREMA VELTRANA':m.competition==='LPV'?'LIGA DE PLATA':m.competition==='CUP'?'COPA DE LAS PROVINCIAS':m.competition==='POST'?'FASE FINAL · LIGA SUPREMA':'TORNEO ESPECIAL';
 modal('El Heraldo de Noveria · Crónica de partido',`<div class="reportwrap"><div class="noPrint between" style="padding:0 0 15px"><span class="muted small">Crónica lista para imprimir o guardar como PDF</span>${button('🖨 Imprimir periódico','print','','btn sm')}</div><article class="newspaper"><div class="paperbrand">EL HERALDO DE NOVERIA<br><span style="font-size:10px;letter-spacing:.13em">EDICIÓN DEPORTIVA · APERTURA ${s.season}</span></div><div class="paperSub" style="margin-top:16px">${E(date)} · JORNADA ${m.round} · ${E(home.stadium)} · ${E(home.city)}</div><h1>${E(headline)}</h1><div class="paper-atmosphere"></div><div class="paperSub" style="text-align:left">${src?'Archivo oficial de resultados':'Crónica del encuentro · Datos generados por el motor de simulación'}</div><div class="paperScore"><span>${E(m.home)}</span><strong>${m.scoreH} — ${m.scoreA}</strong><span>${E(m.away)}</span></div><p style="font-size:17px;font-weight:600">${E(summary)}</p>${m.penalties?`<p style="font-weight:bold">La eliminatoria se decidió tras tiempo extra y penales: ${E(m.penalties)}.</p>`:''}${!src?`<p>Una tarde de fútbol que quedará en los registros de la primera historia futbolística de Noveria. Cada detalle, desde las oportunidades hasta las decisiones tácticas, influye en lo que sucede sobre el césped.</p><h3>Minuto a minuto</h3><div class="timeline">${eh.map(ev=>`<div class="event"><strong>${ev.min}'</strong><span>${E(eventText(ev))} <i>(${ev.side==='home'?E(home.name):E(away.name)})</i></span></div>`).join('')}</div><h3>Así se jugó el partido</h3><div class="paperstats">${metric('Posesión',stats.posH,stats.posA,true)}${metric('Tiros',stats.shotsH,stats.shotsA)}${metric('Tiros al arco',stats.onH,stats.onA)}${metric('Córners',stats.cornersH,stats.cornersA)}${metric('Faltas',stats.foulsH,stats.foulsA)}${metric('Goles esperados',stats.xgH,stats.xgA)}</div><h3>Alineaciones y calificaciones</h3><div class="paperstats">${lines(hPlayers,home)}${lines(aPlayers,away)}</div><h3>El duelo desde el banquillo</h3><p>El entrenador ${E(m.coachAtKickoff?.home||home.coach)} presentó a ${E(home.name)} con un ${E(m.coachAtKickoff?.homeFormation||home.formation)} y un planteamiento de ${E((m.coachAtKickoff?.homeTactic||home.tactic).toLowerCase())}. Enfrente, ${E(m.coachAtKickoff?.away||away.coach)} apostó por el ${E(m.coachAtKickoff?.awayFormation||away.formation)} y ${E((m.coachAtKickoff?.awayTactic||away.tactic).toLowerCase())}.</p>`:`<div style="background:#e1dccf;padding:16px;margin:22px 0;font:13px Arial,sans-serif"><strong>ARCHIVO HISTÓRICO — MARCADOR VERIFICADO</strong><div style="margin-top:7px">Sin acta de goleadores o estadísticas de futbolistas. Para no falsear la historia, esos datos individuales solo se crean desde las jornadas nuevas simuladas por la aplicación.</div></div>`}<div style="border-top:3px double #505a62;margin-top:25px;padding-top:12px;font:11px Arial,sans-serif">NOVERIA FOOTBALL UNIVERSE · Un mundo completamente ficticio · Temporada ${s.season}</div></article></div>`);
}
function clubModal(name){const t=club(name);if(!t)return;const sm=s.fixtures.filter(f=>played(f)&&[f.home,f.away].includes(name));let w=0,d=0,l=0;for(const x of sm){const scored=x.home===name?x.scoreH:x.scoreA,conceded=x.home===name?x.scoreA:x.scoreH;if(scored>conceded)w++;else if(scored===conceded)d++;else l++;}
 modal(t.name,`<div class="stack"><div class="club-heading">${crest(t.name)}<div class="grow"><div class="eyebrow">${E(t.country)} · ${t.division==='LSV'?'Primera':t.division==='LPV'?'Segunda':'Club internacional'}</div><h2 style="font-size:27px;margin:4px 0">${E(t.name)}</h2><div class="muted small">${E(t.nickname)} · Fundado en ${t.year}</div></div></div><div class="supporter-banner stadium-photo" style="--fan-tint:${E(t.primary)}"><span>LA HINCHADA · ${E(t.fans)}</span><strong>${E(t.stadium)}</strong><small>${E(t.city)} · ${n(t.capacity)} espectadores</small></div><div class="grid four">${statBare('OVR',t.rating)}${statBare('PJ oficiales',sm.length)}${statBare('Victorias',w)}${statBare('Trofeos',t.trophies.length)}</div><div class="grid two"><div class="card inner"><h3 class="h3">Identidad y afición</h3><p class="small">${E(t.identity)}</p><p class="small"><b>Hinchada:</b> ${E(t.fans)}</p><p class="small"><b>Estadio:</b> ${E(t.stadium)}, capacidad ${n(t.capacity)}</p><p class="small"><b>Ciudad:</b> ${E(t.city)}</p><p class="small"><b>Colores:</b> <span style="color:${E(t.primary)}">●</span> <span style="color:${E(t.secondary)}">●</span></p></div><div class="card inner"><h3 class="h3">Directiva</h3><p class="small"><b>Presidente:</b> ${E(t.president)}</p><p class="small"><b>DT:</b> ${E(t.coach)}</p><p class="small"><b>Director:</b> ${E(t.director)}</p><p class="small"><b>Táctica:</b> ${E(t.formation)} · ${E(t.tactic)}</p><p class="small"><b>Presupuesto:</b> ${t.budget.toFixed(1)} millones de VLR</p></div></div><h3 class="h3">Uniformes oficiales</h3><div class="kits">${t.kits.map((_,i)=>`<div class="kitbox">${kitSVG(t,i)}<span class="tag">${['LOCAL','VISITANTE','TERCERO'][i]}</span></div>`).join('')}</div><h3 class="h3">Plantilla y estadísticas</h3><div class="tablewrap"><table><thead><tr><th>#</th><th style="text-align:left">Jugador</th><th>POS</th><th>Edad</th><th>OVR</th><th>POT</th><th>PJ</th><th>Goles</th></tr></thead><tbody>${t.players.map(p=>`<tr><td>${p.number}</td><td class="clubname" data-action="player" data-player="${p.id}" data-name="${E(t.name)}">${E(p.name)}</td><td>${p.pos}</td><td>${p.age}</td><td>${p.ovr}</td><td>${p.pot}</td><td>${p.apps}</td><td>${p.goals}</td></tr>`).join('')}</tbody></table></div><div class="between"><h3 class="h3">Palmarés</h3>${button('⚙ Gestionar club','go-office',`data-name="${E(name)}"`,'btn sm')}</div>${t.trophies.length?t.trophies.map(x=>`<div class="tag goldtag">🏆 ${E(x)}</div>`).join(''):'<div class="muted small">Sin títulos en el palmarés.</div>'}</div>`);
}
function playerModal(id,name){const t=club(name),p=t?.players.find(x=>String(x.id)===String(id));if(!p)return;modal(p.name,`<div class="stack"><div class="between"><div><div class="eyebrow">FICHA DE JUGADOR</div><h2 style="font-size:30px;margin:3px 0">${E(p.name)}</h2><div class="muted">${E(t.name)} · ${E(p.nationality)}</div></div><div class="scorebox" style="font-size:30px;color:var(--gold)">${p.ovr}</div></div><div class="grid four">${statBare('POS',p.pos)}${statBare('Edad',p.age)}${statBare('Potencial',p.pot)}${statBare('Valor',n(p.value)+' VLR')}</div><div class="card"><h2 class="h2">Estadísticas acumuladas</h2><div class="grid four">${statBare('Partidos',p.apps)}${statBare('Goles',p.goals)}${statBare('Asistencias',p.assists)}${statBare('Amarillas',p.yellows)}${statBare('Rojas',p.reds)}${statBare('Lesiones',p.injuries)}${statBare('Baja pendiente',(p.outGames||0)+' partidos')}${statBare('Contrato',(p.contractYears||'—')+' años')}${statBare('Forma',p.form+'/10')} ${statBare('Dorsal','#'+p.number)}</div></div><div class="notice">Las estadísticas individuales comienzan con las fechas simuladas en la app. No se inventan goleadores de las primeras seis jornadas.</div></div>`)}
function coachModal(name){const t=club(name);modal('Directiva · '+name,`<div class="stack"><div class="notice">El DT actual es <strong>${E(t.coach)}</strong>. Al cambiarlo se publica una noticia y se registra la destitución. Esto no garantiza resultados positivos.</div><form class="form" id="coachForm"><input type="hidden" name="club" value="${E(name)}"><label class="field"><span>Nombre del nuevo entrenador</span><input class="input" name="coach" maxlength="65" required placeholder="Ej. Marcos Valcera"></label><button class="btn danger" type="submit">Confirmar destitución y nuevo DT</button></form></div>`)}
function showNews(id){const a=s.news.find(n=>n.id===id);if(a?.related){const m=lookupMatch(a.related);if(m){paper(m);return}}if(a)modal(a.title,`<div class="eyebrow">${E(a.category)} · ${E(a.date)}</div><h2 style="font-size:27px">${E(a.title)}</h2><p>${E(a.description)}</p>`)}
function onAction(el){let action=el.dataset.action;if(!action)return;switch(action){case 'nav':nav(el.dataset.target);break;case 'menu':modal('Todas las secciones',`<div class="grid two">${menu.map(([id,icon,label])=>`<button class="btn" data-action="modal-nav" data-target="${id}">${icon} ${E(label)}</button>`).join('')}</div>`);break;case 'modal-nav':close();nav(el.dataset.target);break;case 'table':ui.table=el.dataset.id;nav('clasificaciones');break;case 'simulate-league':{const next=getLeagueNextRound(s);if(next>18)return;let res=simulateLeagueRound(s);save();ui.round=res.round;toast(`⚽ Jornada ${res.round} completada · ${res.matches.length} partidos`);reportResults(res.round,'Jornada '+res.round,res.matches.map(m=>m.id));break;}case 'simulate-post':{try{let games=simulatePostseasonRound(s);save();toast('🏆 Fase final: '+games.length+' encuentros');reportResults(null,'Fase final · '+s.postseason.stage,games.map(m=>m.id));}catch(e){toast(e.message)}break;}case 'simulate-cup':{try{const ms=simulateCupRound(s);save();toast(`🏆 Copa: ${ms.length} encuentros disputados`);reportResults(null,'Copa de las Provincias',ms.map(m=>m.id));}catch(e){toast(e.message)}break;}case 'custom-open':ui.competition=el.dataset.id;nav('torneos');break;case 'simulate-custom':{try{const title=s.competitions.find(c=>c.id===el.dataset.id)?.name||'Torneo';const m=simulateCustomRound(s,el.dataset.id);save();toast(`⚽ ${m.length} encuentros de torneo disputados`);reportResults(null,title,m.map(x=>x.id));}catch(e){toast(e.message)}break;}case 'next-season':{if(!confirm('¿Iniciar la próxima temporada? Se guardará el calendario anterior en el archivo histórico. Recomendamos exportar una copia JSON primero.'))return;try{const res=startNextSeason(s);save();ui.round=1;toast(`🏆 ¡Comienza el Apertura ${res.season}!`);nav('historia')}catch(e){toast(e.message)}break;}case 'history-season':{const a=s.archive?.find(x=>String(x.season)===String(el.dataset.id));if(!a)break;const games=a.fixtures.filter(played);modal('Archivo oficial · Apertura '+a.season,`<div class="stack"><div class="notice">🏆 Campeón anual: ${E(a.annual[0].name)} · Descendieron: ${E(a.relegated.join(', '))} · Ascendieron: ${E(a.promoted.join(', '))}</div><div class="card"><h3 class="h3">Todos los marcadores de ${a.season}</h3>${games.map(m=>`<div class="market-event"><span><span class="tiny muted">J${m.round} · ${m.competition}</span><br>${E(m.home)} <b>${m.scoreH}-${m.scoreA}</b> ${E(m.away)}</span>${button('📰 Acta','match',`data-id="${E(m.id)}"`,'btn sm')}</div>`).join('')}</div></div>`);break;}case 'market-open':{try{openMarket(s,s.leagueRound>=18?`Mercado pos-Apertura ${s.season}`:`Mercado extraordinario · Apertura ${s.season}`);save();toast('💰 Abrió la ventana de pases');render();}catch(e){toast(e.message)}break;}case 'market-next':{try{const r=advanceMarketDay(s);save();toast(r.closed?`¡Mercado cerrado! ${r.report.transfers} traspasos`:`Día ${r.day}: ${r.added.length} fichajes automáticos`);render();}catch(e){toast(e.message)}break;}case 'market-finish':{if(!confirm('¿Simular el resto de la ventana? Los demás clubes realizarán fichajes automáticos y se cerrará el mercado.'))return;try{const r=finishMarket(s);save();toast(`⚡ Cierre del mercado: ${r.report.transfers} fichajes`);render();}catch(e){toast(e.message)}break;}case 'market-offer':marketOfferModal(el.dataset.name,el.dataset.id);break;case 'market-accept':{try{const r=acceptMarketCounter(s,el.dataset.id);save();toast('✍ Contrato firmado: '+r.player);render();}catch(e){toast(e.message)}break;}case 'market-decline':{try{rejectMarketCounter(s,el.dataset.id);save();render();}catch(e){toast(e.message)}break;}case 'market-scout':{const yes=toggleMarketScout(s,el.dataset.id);save();toast(yes?'⚑ Jugador agregado a seguimiento':'Jugador retirado de seguimiento');render();break;}case 'market-academy':{try{const p=recruitAcademyPlayer(s,marketBuyer());save();toast('🌱 Ascendió de cantera: '+p.name+' · POT '+p.pot);render();}catch(e){toast(e.message)}break;}case 'market-train':{try{const name=marketBuyer();const result=trainClub(s,name);save();toast('🏋 Mejoran: '+(result.join(', ')||'plantilla'));render();}catch(e){toast(e.message)}break;}case 'match':paper(lookupMatch(el.dataset.id));break;case 'show-results':reportResults(Number(el.dataset.round));break;case 'comp-report':{const c=s.competitions.find(c=>c.id===el.dataset.id);if(c){const done=c.fixtures.filter(played);if(done.length)reportResults(null,c.name,done.slice(-32).map(m=>m.id));else toast('Este torneo todavía no tiene resultados.')}break;}case 'club':clubModal(el.dataset.name);break;case 'player':playerModal(el.dataset.player,el.dataset.name);break;case 'news':showNews(el.dataset.id);break;case 'shirt':ui.shirt=Number(el.dataset.id);render();break;case 'coach':coachModal(el.dataset.name);break;case 'go-office':ui.team=el.dataset.name;close();nav('directivas');break;case 'close':close();break;case 'close-overlay':if(el.classList.contains('backdrop'))close();break;case 'print':window.print();break;case 'export':{const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='noveria-partida-2026-j'+leagueSummary(s).round+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('💾 Copia descargada');break;}case 'reset':if(confirm('¿Restablecer Noveria? Se perderá todo el progreso de este navegador si no tenés una copia.')){s=freshState();save();ui.round=7;toast('Universo restaurado a Jornada 6');nav('inicio')}break;}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el)onAction(el)});
document.addEventListener('keydown',event=>{if(event.key==='Escape')close();if(event.key==='Enter'&&event.target.matches('.fixture'))onAction(event.target)});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='roundSelect'){ui.round=Number(el.value);render()}else if(el.id==='formatSelect'){const h=$('formatHelp');if(h)h.textContent={league:'Puntos corridos a una vuelta.',league2:'Todos contra todos a ida y vuelta, localía equilibrada.',cup:'Cruces eliminatorios y penales. Clasificación directa, con pases automáticos si es necesario.',recopa:'Final a partido único y cancha neutral. Elegí exactamente dos clubes.',groups:'Grupos de cuatro y fase final. Elegí 4, 8, 12, 16... hasta 32 clubes.'}[el.value]||''}else if(el.id==='clubFilter'){ui.clubFilter=el.value;render()}else if(el.id==='kitClub'){ui.team=el.value;ui.shirt=0;render()}else if(el.id==='marketClubSelect'){ui.marketClub=el.value;ui.team=el.value;render()}else if(el.id==='manageClub'){ui.team=el.value;if(s.mode==='manager'){s.managedClub=ui.team;save()}render()}else if(el.id==='modeSelect'){s.mode=el.value;s.managedClub=ui.team;save();toast(s.mode==='manager'?'Modo entrenador activado':'Modo presidente activado');render()}else if(el.id==='importFile'){
 const f=el.files?.[0];if(!f)return;f.text().then(txt=>{try{const data=validateImport(JSON.parse(txt));if(!confirm('¿Reemplazar esta partida por la copia importada?'))return;s=data;save();ui.round=Math.min(18,getLeagueNextRound(s));toast('Partida recuperada');nav('inicio')}catch(e){toast('Error al importar: '+e.message)}});
 }});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='clubSearch'){ui.clubSearch=el.value;const old=document.querySelector('.clubgrid');if(old){const holder=document.createElement('div');holder.innerHTML=clubGrid();old.replaceWith(holder.firstElementChild)}}else if(el.id==='playerSearch'){ui.playerQuery=el.value;/* Se aplica la búsqueda cuando cambia el campo */}});
document.addEventListener('change',event=>{if(event.target.id==='playerSearch')render()});
document.addEventListener('submit',event=>{const form=event.target;if(!form.id)return;event.preventDefault();try{const v=new FormData(form);if(form.id==='marketSearchForm'){ui.marketSearch=String(v.get('search')||'').trim();ui.marketPos=String(v.get('pos')||'TODAS');ui.marketSort=String(v.get('sort')||'overall');render();return;}else if(form.id==='marketOfferForm'){const offer=submitMarketOffer(s,{buyer:String(v.get('buyer')),seller:String(v.get('seller')),playerId:String(v.get('playerId')),fee:Number(v.get('fee')),wage:Number(v.get('wage')),years:Number(v.get('years'))});close();toast(offer.status==='accepted'?'✅ ¡Fichaje confirmado!':offer.status==='counter'?'↪ Recibiste una contraoferta':'✕ Oferta rechazada');save();nav('mercado');return;}else if(form.id==='kitForm'){const t=club(ui.team);t.kits[ui.shirt]={p:String(v.get('p')),s:String(v.get('s')),pattern:String(v.get('pattern')),sponsor:String(v.get('sponsor')||'NOVERIA').slice(0,18)};toast('👕 Uniforme guardado');}else if(form.id==='tacticsForm'){const t=club(ui.team);t.formation=String(v.get('formation'));t.tactic=String(v.get('tactic'));toast('Táctica actualizada');}else if(form.id==='coachForm'){changeCoach(s,String(v.get('club')),String(v.get('coach')));close();toast('Directiva: cambio de entrenador anunciado');}else if(form.id==='createCompForm'){const teams=[...form.querySelector('[name=teams]').selectedOptions].map(o=>o.value);const id=createCompetition(s,String(v.get('name')),teams,String(v.get('format')));ui.competition=id;toast('🏆 Torneo creado');}save();render();}catch(e){toast('⚠️ '+e.message)}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
render();

</script>
</body></html>
